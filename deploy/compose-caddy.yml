services:
  deye-monitor:
    image: deye-monitor:latest
    volumes:
      - ./config.yaml:/config.yaml:ro
      - tesla-state:/state
      - /var/run/dbus:/var/run/dbus
    environment:
      - TZ=${TZ:-UTC}      # set TZ=Area/City in the .env next to this file
    restart: unless-stopped
    network_mode: host
    privileged: true

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    network_mode: host

volumes:
  tesla-state:
  caddy-data:
  caddy-config:
